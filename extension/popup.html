<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Promptify</title>
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background-color: #f9f9f9;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #e0e0e0;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ccc;
      margin-right: 6px;
    }
    .online { background-color: #4CAF50; }
    .offline { background-color: #F44336; }
    .footer {
      font-size: 11px;
      color: #777;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h2>🛡️ Promptify</h2>
  
  <div class="status" id="status-container">
    <span class="status-indicator" id="status-dot"></span>
    <span id="status-text">Checking connection...</span>
  </div>

  <div style="font-size: 12px; color: #555;">
    Active on:<br>
    ✅ ChatGPT<br>
    ✅ Claude
  </div>

  <div class="footer">
    Local AI Firewall
  </div>

  <script src="popup.js"></script>
</body>
</html>
