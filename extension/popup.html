<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Promptify</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a24;
      color: #e0e0e0;
    }
    .header {
      padding: 16px;
      background: linear-gradient(135deg, #2a2a35, #1e1e28);
      border-bottom: 1px solid #333;
    }
    h2 {
      margin: 0;
      font-size: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-container {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a2a35;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #555;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    .status-indicator.online {
      background-color: #4CAF50;
      box-shadow: 0 0 8px #4CAF50;
    }
    .status-indicator.offline {
      background-color: #F44336;
      box-shadow: 0 0 8px #F44336;
    }
    #status-text {
      font-weight: 600;
      font-size: 14px;
    }
    
    .stats {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 8px 12px;
      border-radius: 6px;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
    }
    .stat-value {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }
    .val-warned { color: #ff9800; }
    .val-blocked { color: #f44336; }

    .footer {
      padding: 16px;
      background: #15151e;
      text-align: center;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #2a2a35;
      line-height: 1.4;
    }
    .code-block {
      display: block;
      background: #000;
      color: #4CAF50;
      padding: 6px;
      border-radius: 4px;
      margin-top: 6px;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;">
      <img src="mascot.svg" alt="Promptify Mascot" style="width: 50px; height: 50px;">
      <h2 style="font-size: 22px; margin: 0;">Promptify</h2>
    </div>
  </div>
  
  <div class="status-container">
    <span class="status-indicator" id="status-dot"></span>
    <span id="status-text">Checking connection...</span>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span class="stat-label">Analyzed Prompts</span>
      <span class="stat-value" id="stat-analyzed">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Warned</span>
      <span class="stat-value val-warned" id="stat-warned">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Blocked</span>
      <span class="stat-value val-blocked" id="stat-blocked">0</span>
    </div>
  </div>

  <div class="footer">
    To view full telemetry and block reasons, run:
    <span class="code-block">promptify replay</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
